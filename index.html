<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <title>RallyCross — Vehicle Physics Prototype</title>
    <meta name="description" content="Prototipe fisika mobil rally di web: three.js + Rapier." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M6 21l4-9h12l4 9z' fill='%23d8402f'/%3E%3Ccircle cx='11' cy='23' r='2.6' fill='%23e8eef6'/%3E%3Ccircle cx='21' cy='23' r='2.6' fill='%23e8eef6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="grade" aria-hidden="true"></div>

    <div id="hud">
      <div id="speedo">
        <span id="speed">0</span>
        <span id="unit">km/h</span>
      </div>
      <div id="gear">N</div>
      <div id="lamps">
        <span id="ind-left" class="ind">◀</span>
        <span id="ind-right" class="ind">▶</span>
        <span id="ind-beam" class="ind beam">◐</span>
      </div>
      <div id="bars"></div>
      <div id="telem"></div>
      <div id="damage" class="hide"></div>
      <div id="auto" class="off">AI nonaktif · P</div>
    </div>

    <div id="board" class="hide">
      <div id="board-head">
        <span>POSISI</span>
        <span id="record">REKOR —</span>
      </div>
      <ol id="standings"></ol>
    </div>

    <div id="help">
      <b>W/↑</b> gas · <b>S/↓</b> rem · <b>A/D ←→</b> setir · <b>Q</b> gigi D/R · <b>Z/X</b> sein ·
      <b>H</b> hazard · <b>L</b> lampu · <b>Space</b> handbrake · <b>R</b> reset · <b>C</b> kamera · <b>P</b> AI · <b>V</b> tonton AI vs AI · <b>G</b> panel · di HP: tombol <b>AI</b> / <b>⚙</b> di kiri atas
    </div>

    <div id="touch">
      <div class="ctl steer" data-ctl="steer">
        <span class="tag">setir</span>
        <div class="track"><div class="knob"></div></div>
      </div>
      <div class="pad right">
        <div class="ctl pedal" data-ctl="brake">
          <span class="tag">rem</span>
          <div class="track"><div class="fill"></div><div class="knob"></div></div>
        </div>
        <div class="ctl pedal" data-ctl="gas">
          <span class="tag">gas</span>
          <div class="track"><div class="fill"></div><div class="knob"></div></div>
        </div>
        <div class="col">
          <button data-gear class="gear" aria-label="gigi maju / mundur" aria-pressed="false">D</button>
          <button data-k="hand" class="hb" aria-label="handbrake">HB</button>
        </div>
      </div>
    </div>

    <div id="lampbar">
      <button data-ai class="ai" aria-label="AI mengemudi" aria-pressed="false">AI</button>
      <button data-tv aria-label="tonton AI vs AI" aria-pressed="false">TV</button>
      <button data-panel aria-label="panel tuning">⚙</button>
      <button data-lamp="left" aria-label="sein kiri" aria-pressed="false">◀</button>
      <button data-lamp="right" aria-label="sein kanan" aria-pressed="false">▶</button>
      <button data-lamp="hazard" aria-label="hazard" aria-pressed="false">!</button>
      <button data-lamp="beam" aria-label="lampu utama" aria-pressed="false">◐</button>
    </div>

    <div id="tv" class="hide">● LIVE</div>
    <div id="finish" class="hide"></div>

    <div id="boot">Menyiapkan fisika…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
